name: CI

# Dependabot の PR を自動で取り込む前の関門 (dependabot-security-merge.yml が
# この結果を待つ)。人が出す PR でも同じ確認が走る。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # lockfile が package.json と合っていないリポジトリがあるので、その場合は入れ直す
      - run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build --if-present

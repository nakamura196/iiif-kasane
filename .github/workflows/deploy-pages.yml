# Build and deploy the Next.js static export to GitHub Pages.
# Vercel build is kept independent (vercel.json handles redirect).
name: Deploy Next.js site to Pages

# A pull request only builds and checks (the site is deployed only by a push to main).
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (npm 11) keeps up with newer lockfiles and dependencies.
          # With Node 20, npm ci sometimes fails with "Missing: <pkg> from lock file"
          # (same reason as in the ci.yml of dts-viewer).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: the dev-only advisories (braces via eslint-config-next)
      # have no fixed release yet and never reach the deployed site.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      # The remaining warnings are React Compiler rules (see eslint.config.mjs).
      # The cap keeps the count from growing; lower it as they are fixed.
      - name: Lint
        run: npm run lint -- --max-warnings=29

      - name: Run unit tests
        run: npm test

      # tsc, then the public API baseline of iiif-kasane (packages/iiif-viewer/api/public-api.txt).
      - name: Type check
        run: npm run typecheck

      # Check first that references also survive a build under a subpath (basePath).
      # kasane.ldas.jp is served at the host root, so production does not use it, but a missing
      # basePath is hidden at the root. The check stays for forks served from github.io and the like.
      - name: Verify subpath build (basePath)
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          ./scripts/check-basepath.sh
          NEXT_PUBLIC_BASE_PATH=/iiif-kasane npm run test:export
          rm -rf out .next

      # Production (kasane.ldas.jp) is served at the host root. The custom domain is already set in the Pages settings (gh api).
      - name: Build static export
        env:
          # GA4 Measurement ID (a public value). Only a deployer who sets NEXT_PUBLIC_GA_ID in the
          # repository Variables turns analytics on. There is no fallback, so that a fork does not
          # send data to the owner's GA by accident. If unset, the build succeeds but
          # GoogleAnalytics is not rendered.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Verify export (links, assets, robots/sitemap, no old hosts)
        run: npm run test:export

      - name: Add .nojekyll
        # Prevents GitHub Pages from running Jekyll, which would strip files
        # whose names start with underscore (e.g. Next.js's _next/ directory).
        run: touch out/.nojekyll

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
